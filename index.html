<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorsoló App</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-1-bg: #2a2a2a;
            --card-2-bg: #3a3a3a;
            --text-color: #ffffff;
            --card-text-color: #ffffff;
            --btn-bg: #4CAF50;
            --btn-text: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-1-bg);
            color: var(--card-text-color);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card.type-2 {
            background-color: var(--card-2-bg);
        }

        .card:active {
            transform: scale(0.98);
        }

        button.action-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button.action-btn:active {
            opacity: 0.8;
        }

        .settings-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-box h3 {
            margin-top: 0;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .color-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .color-row input[type="color"] {
            border: none;
            width: 40px;
            height: 30px;
            cursor: pointer;
            background: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Feladat Sorsoló</h1>
        
        <!-- Példa kártyák -->
        <div class="card" id="card1">Kattints a húzáshoz (1 pontos kártya)</div>
        <div class="card type-2" id="card2">Kattints a húzáshoz (2 pontos kártya)</div>

        <button class="action-btn" onclick="huzas()">Új húzás</button>

        <!-- Egyedi Színválasztó Panel -->
        <div class="settings-box">
            <h3>🎨 Színek testreszabása</h3>
            
            <div class="color-row">
                <label for="bgColor">Teljes háttér:</label>
                <input type="color" id="bgColor" value="#1a1a1a" oninput="changeColor('--bg-color', this.value)">
            </div>
            
            <div class="color-row">
                <label for="card1Bg">1 pontos kártya háttér:</label>
                <input type="color" id="card1Bg" value="#2a2a2a" oninput="changeColor('--card-1-bg', this.value)">
            </div>

            <div class="color-row">
                <label for="card2Bg">2 pontos kártya háttér:</label>
                <input type="color" id="card2Bg" value="#3a3a3a" oninput="changeColor('--card-2-bg', this.value)">
            </div>

            <div class="color-row">
                <label for="textColor">Fő betűszín:</label>
                <input type="color" id="textColor" value="#ffffff" oninput="changeColor('--text-color', this.value)">
            </div>

            <div class="color-row">
                <label for="cardTextColor">Kártya betűszín:</label>
                <input type="color" id="cardTextColor" value="#ffffff" oninput="changeColor('--card-text-color', this.value)">
            </div>

            <div class="color-row">
                <label for="btnBg">Gomb háttérszín:</label>
                <input type="color" id="btnBg" value="#4CAF50" oninput="changeColor('--btn-bg', this.value)">
            </div>
        </div>
    </div>

    <script>
        function changeColor(property, value) {
            document.documentElement.style.setProperty(property, value);
            // Elmentjük localStorage-ba, hogy megjegyezze a beállításaidat újranyitáskor is!
            localStorage.setItem(property, value);
        }

        // Oldal betöltésekor betöltjük a mentett színeket, ha léteznek
        window.onload = function() {
            const properties = ['--bg-color', '--card-1-bg', '--card-2-bg', '--text-color', '--card-text-color', '--btn-bg'];
            properties.forEach(prop => {
                const saved = localStorage.getItem(prop);
                if (saved) {
                    document.documentElement.style.setProperty(prop, saved);
                    // Input értékek frissítése
                    const inputId = {
                        '--bg-color': 'bgColor',
                        '--card-1-bg': 'card1Bg',
                        '--card-2-bg': 'card2Bg',
                        '--text-color': 'textColor',
                        '--card-text-color': 'cardTextColor',
                        '--btn-bg': 'btnBg'
                    }[prop];
                    if(document.getElementById(inputId)) {
                        document.getElementById(inputId).value = saved;
                    }
                }
            });
        };

        function huzas() {
            alert("Itt történik majd a sorsolás!");
        }
    </script>

</body>
</html>
