/* =========================
   ALAP
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "DM Sans", sans-serif;
    background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.55), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(0,0,0,.035), transparent 35%),
        var(--bg);

    color: var(--text);

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

    transition:
        background .5s ease,
        color .5s ease;
}

/* =========================
   APP
========================= */

.app-wrapper {
    width: min(940px, 100%);
    height: min(900px, 94vh);

    position: relative;

    display: flex;
    flex-direction: column;

    padding: 38px 46px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: 38px;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow: var(--shadow);

    overflow: hidden;

    transition:
        background .5s ease,
        box-shadow .5s ease;
}

/* finom dekoráció */

.app-wrapper::before {
    content: "";
    position: absolute;

    width: 320px;
    height: 320px;

    top: -180px;
    left: -160px;

    border-radius: 50%;

    background: rgba(255,255,255,.28);

    pointer-events: none;
}

.app-wrapper::after {
    content: "";
    position: absolute;

    width: 260px;
    height: 260px;

    right: -160px;
    bottom: -160px;

    border-radius: 50%;

    background: rgba(255,255,255,.12);

    pointer-events: none;
}

/* =========================
   HEADER
========================= */

header {
    text-align: center;

    padding-top: 8px;
    margin-bottom: 30px;

    position: relative;
    z-index: 2;
}

.eyebrow {
    font-size: 10px;
    font-weight: 700;

    letter-spacing: 3px;
    text-transform: uppercase;

    color: var(--muted);

    margin-bottom: 10px;
}

h1 {
    font-family: "Playfair Display", serif;

    font-size: clamp(30px, 4vw, 42px);

    line-height: 1.1;

    font-weight: 500;

    letter-spacing: -0.8px;

    color: var(--text);

    margin-bottom: 9px;
}

.subtitle {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .2px;
}

/* =========================
   SETTINGS
========================= */

.settings-container {
    position: absolute;

    top: 25px;
    right: 28px;

    z-index: 20;
}

.icon-btn {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--button-border);

    background: var(--button);
    color: var(--text);

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease;
}

.icon-btn:hover {
    transform: rotate(25deg);
    background: var(--button-hover);
}

.icon-btn:active {
    transform: scale(.92);
}

/* =========================
   THEME MENU
========================= */

.theme-menu {
    position: absolute;

    right: 0;
    top: 53px;

    width: 225px;

    padding: 12px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 6px;

    background: var(--button);

    border: 1px solid var(--button-border);

    border-radius: 22px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.14);

    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(.97);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;
}

.theme-menu.active {
    opacity: 1;
    visibility: visible;

    transform: translateY(0) scale(1);
}

.theme-option {
    min-height: 42px;

    display: flex;
    align-items: center;
    gap: 9px;

    padding: 8px 9px;

    border: none;
    border-radius: 13px;

    background: transparent;

    color: var(--text);

    font-family: inherit;
    font-size: 11px;
    font-weight: 600;

    text-align: left;

    cursor: pointer;

    transition: background .2s ease;
}

.theme-option:hover {
    background: var(--button-hover);
}

.color-dot {
    width: 17px;
    height: 17px;

    flex: 0 0 17px;

    border-radius: 50%;

    border: 1px solid rgba(0,0,0,.08);
}

/* =========================
   KÁRTYÁK
========================= */

.cards-grid {
    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 22px;

    margin: auto 0;

    position: relative;
    z-index: 2;
}

.card {
    min-height: 270px;

    padding: 29px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    border-radius: 27px;

    position: relative;
    overflow: hidden;

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        box-shadow .35s ease;
}

.card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 22px 45px rgba(0,0,0,.10);
}

/* dekoratív kör */

.card::after {
    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    right: -85px;
    top: -85px;

    border-radius: 50%;

    border: 1px solid currentColor;

    opacity: .08;
}

.card-top {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

    opacity: .58;
}

.card-top::before {
    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: currentColor;

    opacity: .6;
}

.card-content {
    font-family: "Playfair Display", serif;

    font-size: clamp(21px, 2.6vw, 28px);

    line-height: 1.32;

    font-weight: 400;

    letter-spacing: -.2px;

    margin: 25px 0;

    overflow-wrap: anywhere;

    text-align: center;
}

.card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.card-number {
    font-size: 10px;

    letter-spacing: 2px;

    opacity: .45;
}

.card-bottom-line {
    width: 32px;
    height: 1px;

    background: currentColor;

    opacity: .3;
}

.card-1 {
    background: var(--card1);
    color: var(--card1-text);
}

.card-2 {
    background: var(--card2);
    color: var(--card2-text);
}

/* =========================
   VEZÉRLŐK
========================= */

.controls-area {
    position: relative;
    z-index: 2;

    margin-top: 30px;
}

.controls {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 9px;

    flex-wrap: wrap;
}

.btn {
    min-height: 46px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 9px;

    padding: 0 18px;

    border-radius: 15px;

    border: 1px solid var(--button-border);

    background: var(--button);

    color: var(--text);

    font-family: inherit;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: .5px;

    cursor: pointer;

    box-shadow: 0 3px 10px rgba(0,0,0,.025);

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.btn:hover:not(:disabled) {
    background: var(--button-hover);

    box-shadow:
        0 7px 20px rgba(0,0,0,.06);

    transform: translateY(-1px);
}

.btn:active:not(:disabled) {
    transform: scale(.97);
}

#draw-btn {
    min-width: 150px;

    background: var(--accent);

    color: var(--button);

    border-color: var(--accent);

    letter-spacing: 1.2px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.12);
}

#draw-btn:hover:not(:disabled) {
    background: var(--accent-hover);

    box-shadow:
        0 12px 28px rgba(0,0,0,.16);
}

.btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* =========================
   FILE
========================= */

.file-name {
    max-width: 145px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

#csv-file {
    display: none;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .app-wrapper {
        width: 100%;
        height: 100%;

        max-height: none;

        border-radius: 0;

        padding:
            28px 20px
            calc(22px + env(safe-area-inset-bottom));
    }

    .settings-container {
        top: 18px;
        right: 18px;
    }

    header {
        margin-bottom: 20px;
    }

    h1 {
        font-size: 30px;
    }

    .cards-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .card {
        min-height: 175px;
        padding: 21px;
    }

    .card-content {
        font-size: 22px;
        margin: 13px 0;
    }

    .controls {
        gap: 7px;
    }

    .btn {
        min-height: 43px;
        padding: 0 13px;
    }

    #draw-btn {
        min-width: 130px;
    }
}

@media (max-height: 650px) and (orientation: landscape) {

    .app-wrapper {
        padding: 20px 30px;
        max-height: 96vh;
    }

    header {
        margin-bottom: 12px;
        padding-top: 0;
    }

    .eyebrow {
        display: none;
    }

    h1 {
        font-size: 27px;
    }

    .cards-grid {
        gap: 14px;
    }

    .card {
        min-height: 145px;
        padding: 20px;
    }

    .card-content {
        font-size: 20px;
        margin: 10px 0;
    }

    .controls-area {
        margin-top: 12px;
    }
}

</style>
</head>

                     stroke-linejoin="round">

                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>

                </svg>

                RESET

            </button>

        </div>

    </div>

</div>


<script>

let tasks1 = [];
let tasks2 = [];
let origTotal = 0;


/* =========================
   TÉMA
========================= */

const settingsToggle =
    document.getElementById("settings-toggle");

const themeMenu =
    document.getElementById("theme-menu");


settingsToggle.addEventListener("click", function(e) {

    e.stopPropagation();

    themeMenu.classList.toggle("active");

});


document.addEventListener("click", function() {

    themeMenu.classList.remove("active");

});


function setTheme(theme) {

    if (theme === "default") {

        document.documentElement
            .removeAttribute("data-theme");

    } else {

        document.documentElement
            .setAttribute("data-theme", theme);

    }

    localStorage.setItem(
        "sorsolo_theme",
        theme
    );

    themeMenu.classList.remove("active");
}


/* mentett téma */

const savedTheme =
    localStorage.getItem("sorsolo_theme");

if (savedTheme) {

    setTheme(savedTheme);

}


/* =========================
   CSV BETÖLTÉS
========================= */

document
.getElementById("csv-file")
.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;


    document
    .getElementById("upload-label-text")
    .innerText = file.name;


    const reader = new FileReader();

    reader.readAsArrayBuffer(file);


    reader.onload = function(e) {

        const buffer = e.target.result;


        /* Magyar Excel CSV */

        const decoder =
            new TextDecoder("windows-1250");


        const text =
            decoder.decode(buffer);


        const lines =
            text.split(/\r\n|\n/);


        tasks1 = [];
        tasks2 = [];


        lines.forEach(function(line) {

            if (line.trim() === "")
                return;


            let separator =
                line.includes(";")
                    ? ";"
                    : ",";


            let cols =
                line
                .split(separator)
                .map(function(c) {

                    return c
                    .trim()
                    .replace(
                        /^["']|["']$/g,
                        ""
                    );

                });


            if (
                cols[0] &&
                cols[0].length > 0
            ) {

                tasks1.push(cols[0]);

            }


            if (
                cols[1] &&
                cols[1].length > 0
            ) {

                tasks2.push(cols[1]);

            }

        });


        origTotal =
            Math.max(
                tasks1.length,
                tasks2.length
            );


        if (origTotal > 0) {

            document
            .getElementById("draw-btn")
            .disabled = false;


            document
            .getElementById("card-1-text")
            .innerText =
                "Készen áll a sorsolásra.";


            document
            .getElementById("card-2-text")
            .innerText =
                "Készen áll a sorsolásra.";


            updateProgress();

        } else {

            alert(
                "Nem találtam feladatokat a fájlban!"
            );

        }

    };

});


/* =========================
   SORSOLÁS
========================= */

document
.getElementById("draw-btn")
.addEventListener("click", function() {

    if (
        tasks1.length === 0 &&
        tasks2.length === 0
    ) {

        alert(
            "Elfogyott az összes kártya!"
        );

        this.disabled = true;

        return;

    }


    if (tasks1.length > 0) {

        const index1 =
            Math.floor(
                Math.random() *
                tasks1.length
            );


        document
        .getElementById("card-1-text")
        .innerText =
            tasks1.splice(index1, 1)[0];

    } else {

        document
        .getElementById("card-1-text")
        .innerText =
            "Elfogytak az 1 pontos feladatok.";

    }


    if (tasks2.length > 0) {

        const index2 =
            Math.floor(
                Math.random() *
                tasks2.length
            );


        document
        .getElementById("card-2-text")
        .innerText =
            tasks2.splice(index2, 1)[0];

    } else {

        document
        .getElementById("card-2-text")
        .innerText =
            "Elfogytak a 2 pontos feladatok.";

    }


    updateProgress();

});


/* =========================
   RESET
========================= */

document
.getElementById("reset-btn")
.addEventListener("click", function() {

    location.reload();

});


/* =========================
   PROGRESS
========================= */

function updateProgress() {

    const remaining =
        Math.max(
            tasks1.length,
            tasks2.length
        );


    const sorsoltIndex =
        origTotal - remaining;


    document
    .getElementById("progress-info")
    .innerText =
        `Sorsolt sor: ${sorsoltIndex} / ${origTotal}`;

}

</script>

</body>
</html>
